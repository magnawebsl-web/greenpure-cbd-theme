<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-bc" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8f0"/>
    </radialGradient>
    <!-- Dark green tin/balm container -->
    <linearGradient id="tin-bc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#2e7d32" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#388e3c" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#2e7d32" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.88"/>
    </linearGradient>
    <!-- Tin lid - green with golden edge -->
    <linearGradient id="tin-lid-bc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="30%" stop-color="#2e7d32"/>
      <stop offset="60%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <radialGradient id="tin-lid-top-bc" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#0a3010"/>
    </radialGradient>
    <!-- Balm texture (greenish/amber) -->
    <radialGradient id="balm-bc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0ead0"/>
      <stop offset="50%" stop-color="#d4b870"/>
      <stop offset="100%" stop-color="#a07830"/>
    </radialGradient>
    <!-- Gold accent -->
    <linearGradient id="gold-bc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <filter id="shadow-bc" x="-25%" y="-15%" width="150%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="3" dy="15" result="offsetBlur"/>
      <feFlood flood-color="#1a3010" flood-opacity="0.20" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="label-shadow-bc">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-bc)"/>
  <ellipse cx="200" cy="200" rx="140" ry="135" fill="#2e7d32" opacity="0.03"/>
  <ellipse cx="200" cy="363" rx="75" ry="11" fill="#1a3010" opacity="0.12"/>

  <g filter="url(#shadow-bc)">
    <!-- TIN CAN body (flat round tin) -->
    <ellipse cx="200" cy="335" rx="95" ry="18" fill="#1b5e20" stroke="#133a15" stroke-width="0.8"/>
    <rect x="105" y="218" width="190" height="118" rx="8" fill="url(#tin-bc)" stroke="#1b5e20" stroke-width="0.8"/>
    <ellipse cx="200" cy="218" rx="95" ry="18" fill="#2e7d32" stroke="#1b5e20" stroke-width="0.8"/>

    <!-- Tin left metallic shine -->
    <rect x="112" y="225" width="14" height="105" rx="7" fill="white" opacity="0.12"/>
    <!-- Secondary shine -->
    <rect x="130" y="222" width="6" height="60" rx="3" fill="white" opacity="0.08"/>
    <!-- Right edge shadow -->
    <rect x="272" y="228" width="8" height="80" rx="4" fill="#0a3010" opacity="0.25"/>
    <!-- Top highlight -->
    <ellipse cx="172" cy="214" rx="52" ry="10" fill="white" opacity="0.15"/>

    <!-- LABEL - white oval on tin -->
    <ellipse cx="200" cy="278" rx="75" ry="48" fill="white" filter="url(#label-shadow-bc)"/>
    <ellipse cx="200" cy="278" rx="73" ry="46" fill="white" stroke="#e8d8c0" stroke-width="0.8"/>

    <!-- Label inner green arch top -->
    <path d="M128,260 A72,46 0 0,1 272,260" fill="#2e7d32"/>
    <text x="200" y="255" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2.5">GREENPURE</text>

    <!-- Leaf icon -->
    <g transform="translate(200, 270)">
      <path d="M0,-10 C7,-5 7,5 0,10 C-7,5 -7,-5 0,-10Z" fill="#2e7d32" opacity="0.80"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a227" stroke-width="0.9"/>
      <line x1="-5" y1="1" x2="5" y2="1" stroke="#c9a227" stroke-width="0.6" opacity="0.65"/>
    </g>

    <text x="200" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#1b5e20" text-anchor="middle" letter-spacing="0.5">BAUME CBD</text>
    <text x="200" y="299" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#c9a227" text-anchor="middle" letter-spacing="0.5">300 mg CBD · 50 ml</text>
    <rect x="145" y="303" width="110" height="1.5" rx="0.75" fill="url(#gold-bc)"/>
    <text x="200" y="313" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#555555" text-anchor="middle" letter-spacing="0.3">Beurre de karité · Arnica · CBD</text>
    <text x="200" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#777777" text-anchor="middle" letter-spacing="0.2">Soulagement · Récupération</text>

    <!-- LID (same dark green, flat) -->
    <rect x="105" y="185" width="190" height="35" rx="10" fill="url(#tin-lid-bc)"/>
    <ellipse cx="200" cy="185" rx="95" ry="18" fill="url(#tin-lid-top-bc)"/>
    <!-- Lid top highlight -->
    <ellipse cx="168" cy="180" rx="55" ry="10" fill="white" opacity="0.12"/>
    <!-- Lid gold ring edge -->
    <rect x="105" y="196" width="190" height="5" rx="2.5" fill="url(#gold-bc)" opacity="0.75"/>
    <rect x="105" y="203" width="190" height="4" rx="2" fill="url(#gold-bc)" opacity="0.5"/>
    <rect x="105" y="210" width="190" height="3" rx="1.5" fill="url(#gold-bc)" opacity="0.35"/>

    <!-- Brand on lid -->
    <text x="200" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2" opacity="0.85">GREENPURE</text>

    <!-- CBD leaf on lid -->
    <g transform="translate(200, 168)" opacity="0.60">
      <path d="M0,-10 C7,-5 7,5 0,10 C-7,5 -7,-5 0,-10Z" fill="#c9a227"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="0.8"/>
    </g>

    <ellipse cx="200" cy="348" rx="90" ry="10" fill="#133a15" opacity="0.20"/>
  </g>
</svg>
