<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-cap" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8f5"/>
    </radialGradient>
    <!-- Blister pack aluminum top -->
    <linearGradient id="blister-top-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="25%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <!-- Blister pack bottom -->
    <linearGradient id="blister-bottom-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8d8c8"/>
      <stop offset="50%" stop-color="#a0b8a0"/>
      <stop offset="100%" stop-color="#88a888"/>
    </linearGradient>
    <!-- Capsule shell (green/white) -->
    <linearGradient id="capsule-green-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="40%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="capsule-white-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <!-- Capsule bubble dome gradient -->
    <radialGradient id="bubble-cap" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8f0d8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a0c8a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#609060" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Gold accent -->
    <linearGradient id="gold-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <!-- Label -->
    <linearGradient id="label-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3faf3"/>
    </linearGradient>
    <linearGradient id="label-green-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="shadow-cap" x="-25%" y="-15%" width="150%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="3" dy="14" result="offsetBlur"/>
      <feFlood flood-color="#1a3a10" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="label-shadow-cap">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-cap)"/>
  <ellipse cx="200" cy="200" rx="140" ry="130" fill="#2e7d32" opacity="0.025"/>
  <ellipse cx="200" cy="362" rx="120" ry="12" fill="#1a3a10" opacity="0.10"/>

  <g filter="url(#shadow-cap)">
    <!-- BLISTER PACK main body (aluminum tray) -->
    <!-- Bottom backing (aluminum foil) -->
    <rect x="70" y="165" width="260" height="185" rx="8" fill="url(#blister-bottom-cap)" stroke="#88a888" stroke-width="0.8"/>
    <!-- Bottom backing shine -->
    <rect x="78" y="172" width="16" height="165" rx="8" fill="white" opacity="0.18"/>
    <rect x="78" y="172" width="244" height="10" rx="5" fill="white" opacity="0.20"/>

    <!-- Aluminum top layer -->
    <rect x="70" y="135" width="260" height="32" rx="6" fill="url(#blister-top-cap)" stroke="#d0d0d0" stroke-width="0.7"/>
    <!-- Foil shine -->
    <rect x="78" y="138" width="244" height="12" rx="3" fill="white" opacity="0.30"/>
    <rect x="78" y="155" width="244" height="8" rx="2" fill="white" opacity="0.12"/>

    <!-- Blister pack grid perforation marks -->
    <line x1="70" y1="165" x2="330" y2="165" stroke="#70a070" stroke-width="1.2"/>

    <!-- CAPSULE BUBBLES (3x3 grid = 9 capsules visible) -->
    <!-- Row 1 -->
    <!-- Bubble 1 (col1 row1) -->
    <ellipse cx="120" cy="195" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="120" cy="192" rx="22" ry="17" fill="url(#capsule-green-cap)" rx="16" ry="10"/>
    <ellipse cx="120" cy="198" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="113" cy="190" rx="8" ry="5" fill="white" opacity="0.35"/>

    <!-- Bubble 2 (col2 row1) -->
    <ellipse cx="200" cy="195" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="200" cy="192" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="200" cy="198" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="193" cy="190" rx="8" ry="5" fill="white" opacity="0.35"/>

    <!-- Bubble 3 (col3 row1) -->
    <ellipse cx="280" cy="195" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="280" cy="192" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="280" cy="198" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="273" cy="190" rx="8" ry="5" fill="white" opacity="0.35"/>

    <!-- Row 2 -->
    <ellipse cx="120" cy="255" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="120" cy="252" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="120" cy="258" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="113" cy="250" rx="8" ry="5" fill="white" opacity="0.35"/>

    <ellipse cx="200" cy="255" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="200" cy="252" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="200" cy="258" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="193" cy="250" rx="8" ry="5" fill="white" opacity="0.35"/>

    <ellipse cx="280" cy="255" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="280" cy="252" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="280" cy="258" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="273" cy="250" rx="8" ry="5" fill="white" opacity="0.35"/>

    <!-- Row 3 (bottom) -->
    <ellipse cx="120" cy="315" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="120" cy="312" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="120" cy="318" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="113" cy="310" rx="8" ry="5" fill="white" opacity="0.35"/>

    <ellipse cx="200" cy="315" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="200" cy="312" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="200" cy="318" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="193" cy="310" rx="8" ry="5" fill="white" opacity="0.35"/>

    <ellipse cx="280" cy="315" rx="28" ry="22" fill="url(#bubble-cap)" stroke="#90b890" stroke-width="0.8"/>
    <ellipse cx="280" cy="312" rx="22" ry="17" fill="url(#capsule-green-cap)"/>
    <ellipse cx="280" cy="318" rx="15" ry="9" fill="url(#capsule-white-cap)"/>
    <ellipse cx="273" cy="310" rx="8" ry="5" fill="white" opacity="0.35"/>

    <!-- PRINTED LABEL on aluminum top area -->
    <rect x="78" y="138" width="244" height="26" rx="4" fill="url(#label-green-cap)" opacity="0.90"/>
    <text x="200" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">GREENPURE</text>
    <text x="200" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1.5">CAPSULES CBD · 25 mg · 30 capsules</text>

    <!-- Small info label attached on side -->
    <rect x="70" y="75" width="260" height="62" rx="8" fill="url(#label-cap)" filter="url(#label-shadow-cap)" stroke="#d8e8d8" stroke-width="0.8"/>
    <rect x="70" y="75" width="260" height="20" rx="8" fill="url(#label-green-cap)"/>
    <rect x="70" y="87" width="260" height="8" fill="url(#label-green-cap)"/>
    <text x="200" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">GREENPURE</text>
    <text x="200" y="93" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1.5">CBD PREMIUM</text>

    <!-- Main product info -->
    <text x="200" y="107" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#1b5e20" text-anchor="middle" letter-spacing="0.5">CAPSULES CBD</text>
    <rect x="110" y="111" width="180" height="1.5" rx="0.75" fill="url(#gold-cap)"/>
    <text x="200" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#444444" text-anchor="middle" letter-spacing="0.3">25 mg par capsule · 30 capsules · Full Spectrum</text>
    <text x="200" y="133" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#777777" text-anchor="middle" letter-spacing="0.2">Chanvre BIO · Huile de coco · Vegan</text>
  </g>
</svg>
