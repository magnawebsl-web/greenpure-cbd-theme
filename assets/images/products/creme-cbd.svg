<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-cc" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f5f0"/>
    </radialGradient>
    <!-- Cream jar body - white ceramic/glass -->
    <linearGradient id="jar-cc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0d0" stop-opacity="0.5"/>
      <stop offset="15%" stop-color="#ebebeb" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fafafa" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#eeeeee" stop-opacity="0.88"/>
      <stop offset="85%" stop-color="#c8c8c8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8a8a8" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Jar bottom -->
    <linearGradient id="jar-bottom-cc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <!-- Golden lid -->
    <linearGradient id="lid-cc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="25%" stop-color="#c9a227"/>
      <stop offset="60%" stop-color="#e8c040"/>
      <stop offset="100%" stop-color="#8a6210"/>
    </linearGradient>
    <radialGradient id="lid-top-cc" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f5dc70"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#6a4808"/>
    </radialGradient>
    <!-- Cream texture on lid (open jar hint) -->
    <radialGradient id="cream-cc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="60%" stop-color="#faf5e8"/>
      <stop offset="100%" stop-color="#f0ead0"/>
    </radialGradient>
    <linearGradient id="label-cc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfaf5"/>
    </linearGradient>
    <linearGradient id="label-top-cc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="gold-cc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <filter id="shadow-cc" x="-25%" y="-15%" width="150%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="3" dy="15" result="offsetBlur"/>
      <feFlood flood-color="#302010" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="label-shadow-cc">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-cc)"/>
  <ellipse cx="200" cy="200" rx="140" ry="135" fill="#2e7d32" opacity="0.02"/>
  <ellipse cx="200" cy="363" rx="75" ry="11" fill="#302010" opacity="0.11"/>

  <g filter="url(#shadow-cc)">
    <!-- JAR BODY (wide, flat cosmetic jar) -->
    <!-- Bottom ellipse of jar -->
    <ellipse cx="200" cy="330" rx="95" ry="20" fill="url(#jar-bottom-cc)" stroke="#c8c8c8" stroke-width="0.8"/>
    <!-- Jar cylindrical body -->
    <rect x="105" y="215" width="190" height="115" rx="12" fill="url(#jar-cc)" stroke="#c8c8c8" stroke-width="0.8"/>
    <!-- Top of jar body (ellipse) -->
    <ellipse cx="200" cy="215" rx="95" ry="20" fill="url(#jar-cc)" stroke="#c8c8c8" stroke-width="0.8"/>

    <!-- Jar left shine -->
    <rect x="112" y="222" width="16" height="100" rx="8" fill="white" opacity="0.48"/>
    <!-- Jar secondary shine -->
    <rect x="132" y="220" width="7" height="60" rx="3.5" fill="white" opacity="0.22"/>
    <!-- Right subtle -->
    <rect x="272" y="228" width="8" height="80" rx="4" fill="white" opacity="0.12"/>
    <!-- Top highlight ellipse -->
    <ellipse cx="175" cy="212" rx="55" ry="10" fill="white" opacity="0.30"/>

    <!-- LABEL on jar side -->
    <rect x="120" y="228" width="160" height="90" rx="6" fill="url(#label-cc)" filter="url(#label-shadow-cc)" stroke="#e0d8c8" stroke-width="0.8"/>
    <rect x="120" y="228" width="160" height="22" rx="6" fill="url(#label-top-cc)"/>
    <rect x="120" y="242" width="160" height="8" fill="url(#label-top-cc)"/>
    <text x="200" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">BORÉA</text>
    <text x="200" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1.5">CBD COSMÉTIQUE</text>

    <!-- Leaf icon -->
    <g transform="translate(200, 262)">
      <path d="M0,-9 C6.5,-4 6.5,4 0,9 C-6.5,4 -6.5,-4 0,-9Z" fill="#2e7d32" opacity="0.75"/>
      <line x1="0" y1="-7" x2="0" y2="7.5" stroke="#c9a227" stroke-width="0.8"/>
    </g>

    <text x="200" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#222222" text-anchor="middle" letter-spacing="1">CRÈME CBD</text>
    <text x="200" y="292" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#2e7d32" text-anchor="middle" letter-spacing="0.5">250 mg CBD · 50 ml</text>
    <rect x="138" y="297" width="124" height="1.5" rx="0.75" fill="url(#gold-cc)"/>
    <text x="200" y="307" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#666666" text-anchor="middle" letter-spacing="0.3">Hydratation · Anti-âge · Apaisante</text>
    <text x="200" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#888888" text-anchor="middle" letter-spacing="0.2">Huile de chanvre · Aloe vera · Collagène</text>

    <!-- LID (golden, flat wide) -->
    <!-- Lid side -->
    <rect x="105" y="185" width="190" height="32" rx="10" fill="url(#lid-cc)"/>
    <!-- Lid top face -->
    <ellipse cx="200" cy="185" rx="95" ry="20" fill="url(#lid-top-cc)"/>
    <!-- Lid top shine highlight -->
    <ellipse cx="175" cy="180" rx="50" ry="10" fill="white" opacity="0.22"/>
    <!-- Lid grip band -->
    <rect x="107" y="196" width="186" height="4" rx="2" fill="#a07818" opacity="0.35"/>
    <rect x="107" y="202" width="186" height="3" rx="1.5" fill="#a07818" opacity="0.25"/>
    <rect x="107" y="208" width="186" height="3" rx="1.5" fill="#a07818" opacity="0.18"/>

    <!-- BORÉA logo on lid top -->
    <text x="200" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#8a6210" text-anchor="middle" letter-spacing="2" opacity="0.8">BORÉA</text>

    <!-- Gold leaf on lid -->
    <g transform="translate(200, 168)" opacity="0.65">
      <path d="M0,-10 C7,-5 7,5 0,10 C-7,5 -7,-5 0,-10Z" fill="#8a6210"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a227" stroke-width="0.8"/>
    </g>

    <!-- Bottom shadow/reflection -->
    <ellipse cx="200" cy="345" rx="90" ry="10" fill="#c8c8c8" opacity="0.18"/>
  </g>
</svg>
