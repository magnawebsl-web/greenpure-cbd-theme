<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Warm studio background -->
    <radialGradient id="bg-fi" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f5f0"/>
    </radialGradient>
    <!-- Deep purple trichome glow -->
    <radialGradient id="trichome-glow-fi" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7b1fa2" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4a1070" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="0.03"/>
    </radialGradient>
    <!-- Bud core gradient -->
    <radialGradient id="bud-core-fi" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="40%" stop-color="#2e7d32"/>
      <stop offset="75%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a3010"/>
    </radialGradient>
    <!-- Purple accent on bud -->
    <radialGradient id="purple-fi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4a0080" stop-opacity="0.2"/>
    </radialGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leaf-fi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- Stem -->
    <linearGradient id="stem-fi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33691e"/>
      <stop offset="50%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <!-- Gold accent for label -->
    <linearGradient id="gold-fi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow-fi" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="18" result="offsetBlur"/>
      <feFlood flood-color="#1a3a10" flood-opacity="0.20" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Trichome sparkle filter -->
    <filter id="trichome-fi">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Soft bud glow -->
    <filter id="bud-glow-fi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#7b1fa2" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-fi)"/>
  <!-- Purple atmospheric glow -->
  <ellipse cx="200" cy="190" rx="130" ry="120" fill="url(#trichome-glow-fi)"/>
  <!-- Ground shadow -->
  <ellipse cx="200" cy="365" rx="90" ry="12" fill="#1a3a10" opacity="0.10"/>

  <g filter="url(#shadow-fi)">
    <!-- STEM -->
    <rect x="196" y="295" width="8" height="65" rx="4" fill="url(#stem-fi)"/>
    <!-- Stem highlight -->
    <rect x="198" y="295" width="2" height="60" rx="1" fill="#8bc34a" opacity="0.5"/>

    <!-- LARGE SUGAR LEAVES (background) -->
    <!-- Left large leaf -->
    <g transform="translate(160, 260) rotate(-35)">
      <path d="M0,0 C-15,-20 -25,-45 -10,-65 C5,-45 10,-20 0,0Z" fill="url(#leaf-fi)" opacity="0.85"/>
      <path d="M0,0 C-5,-22 -8,-45 -10,-65" stroke="#1b5e20" stroke-width="0.8" fill="none" opacity="0.5"/>
    </g>
    <!-- Right large leaf -->
    <g transform="translate(240, 260) rotate(35)">
      <path d="M0,0 C15,-20 25,-45 10,-65 C-5,-45 -10,-20 0,0Z" fill="url(#leaf-fi)" opacity="0.85"/>
      <path d="M0,0 C5,-22 8,-45 10,-65" stroke="#1b5e20" stroke-width="0.8" fill="none" opacity="0.5"/>
    </g>

    <!-- MAIN BUD CLUSTER -->
    <g filter="url(#bud-glow-fi)">
      <!-- Large central bud -->
      <ellipse cx="200" cy="195" rx="62" ry="80" fill="url(#bud-core-fi)"/>
      <!-- Purple patches (indica coloring) -->
      <ellipse cx="195" cy="180" rx="28" ry="35" fill="url(#purple-fi)"/>
      <ellipse cx="215" cy="205" rx="20" ry="28" fill="url(#purple-fi)" opacity="0.7"/>
      <ellipse cx="182" cy="210" rx="15" ry="22" fill="url(#purple-fi)" opacity="0.5"/>

      <!-- Smaller satellite buds -->
      <ellipse cx="165" cy="225" rx="35" ry="45" fill="url(#bud-core-fi)" opacity="0.9"/>
      <ellipse cx="167" cy="215" rx="14" ry="18" fill="url(#purple-fi)" opacity="0.6"/>
      <ellipse cx="235" cy="225" rx="35" ry="45" fill="url(#bud-core-fi)" opacity="0.9"/>
      <ellipse cx="237" cy="215" rx="14" ry="18" fill="url(#purple-fi)" opacity="0.55"/>
      <!-- Top bud -->
      <ellipse cx="200" cy="155" rx="38" ry="48" fill="url(#bud-core-fi)" opacity="0.95"/>
      <ellipse cx="198" cy="148" rx="16" ry="22" fill="url(#purple-fi)" opacity="0.65"/>
    </g>

    <!-- CALYXES - small rounded bud parts -->
    <ellipse cx="200" cy="175" rx="18" ry="22" fill="#2e7d32" opacity="0.6"/>
    <ellipse cx="190" cy="188" rx="14" ry="18" fill="#388e3c" opacity="0.55"/>
    <ellipse cx="212" cy="188" rx="14" ry="18" fill="#388e3c" opacity="0.55"/>
    <ellipse cx="200" cy="205" rx="20" ry="25" fill="#2e7d32" opacity="0.5"/>
    <ellipse cx="178" cy="195" rx="12" ry="16" fill="#388e3c" opacity="0.5"/>
    <ellipse cx="222" cy="195" rx="12" ry="16" fill="#388e3c" opacity="0.5"/>
    <ellipse cx="160" cy="228" rx="18" ry="22" fill="#2e7d32" opacity="0.5"/>
    <ellipse cx="240" cy="228" rx="18" ry="22" fill="#2e7d32" opacity="0.5"/>

    <!-- TRICHOMES (white sparkly dots) -->
    <!-- Main bud trichomes -->
    <circle cx="200" cy="170" r="2.5" fill="white" opacity="0.75"/>
    <circle cx="193" cy="162" r="2" fill="white" opacity="0.65"/>
    <circle cx="208" cy="165" r="1.8" fill="white" opacity="0.60"/>
    <circle cx="186" cy="178" r="2.2" fill="white" opacity="0.70"/>
    <circle cx="215" cy="178" r="2" fill="white" opacity="0.65"/>
    <circle cx="196" cy="158" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="204" cy="155" r="2" fill="white" opacity="0.60"/>
    <circle cx="185" cy="193" r="2.2" fill="white" opacity="0.65"/>
    <circle cx="218" cy="190" r="2" fill="white" opacity="0.60"/>
    <circle cx="200" cy="200" r="2.5" fill="white" opacity="0.70"/>
    <circle cx="175" cy="215" r="2" fill="white" opacity="0.60"/>
    <circle cx="225" cy="215" r="2" fill="white" opacity="0.60"/>
    <circle cx="162" cy="228" r="1.8" fill="white" opacity="0.55"/>
    <circle cx="238" cy="230" r="1.8" fill="white" opacity="0.55"/>
    <!-- Amber trichomes -->
    <circle cx="210" cy="172" r="1.2" fill="#c9a227" opacity="0.7"/>
    <circle cx="191" cy="183" r="1.2" fill="#c9a227" opacity="0.65"/>
    <circle cx="207" cy="196" r="1.2" fill="#c9a227" opacity="0.60"/>
    <circle cx="178" cy="207" r="1" fill="#c9a227" opacity="0.55"/>
    <circle cx="225" cy="205" r="1" fill="#c9a227" opacity="0.55"/>
    <!-- Head of trichome stalk (milky white) -->
    <circle cx="203" cy="160" r="1.5" fill="#fffde0" opacity="0.8"/>
    <circle cx="196" cy="175" r="1.5" fill="#fffde0" opacity="0.75"/>
    <circle cx="212" cy="185" r="1.3" fill="#fffde0" opacity="0.70"/>
    <circle cx="188" cy="200" r="1.3" fill="#fffde0" opacity="0.65"/>

    <!-- Small leaves between buds -->
    <g transform="translate(200, 245) rotate(0)">
      <path d="M0,0 C-8,-12 -14,-28 -6,-38 C3,-28 5,-12 0,0Z" fill="#558b2f" opacity="0.7"/>
      <line x1="0" y1="0" x2="-6" y2="-38" stroke="#33691e" stroke-width="0.7" opacity="0.5"/>
    </g>
    <g transform="translate(185, 248) rotate(-20)">
      <path d="M0,0 C-6,-10 -10,-22 -4,-30 C3,-22 4,-10 0,0Z" fill="#558b2f" opacity="0.6"/>
    </g>
    <g transform="translate(215, 248) rotate(20)">
      <path d="M0,0 C6,-10 10,-22 4,-30 C-3,-22 -4,-10 0,0Z" fill="#558b2f" opacity="0.6"/>
    </g>

    <!-- PISTILS (orange/red hairs) -->
    <!-- Curved orange hairs on bud surface -->
    <path d="M195,168 C192,155 189,145 192,138" stroke="#ff6f00" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M205,165 C208,153 211,143 208,136" stroke="#ff8f00" stroke-width="1.2" fill="none" opacity="0.75"/>
    <path d="M188,180 C184,168 180,158 183,150" stroke="#ff6f00" stroke-width="1.1" fill="none" opacity="0.7"/>
    <path d="M214,178 C218,166 222,156 219,148" stroke="#ffa000" stroke-width="1.1" fill="none" opacity="0.7"/>
    <path d="M197,192 C193,180 190,170 193,162" stroke="#ff6f00" stroke-width="1" fill="none" opacity="0.65"/>
    <path d="M203,195 C207,183 210,173 207,165" stroke="#ff8f00" stroke-width="1" fill="none" opacity="0.65"/>
    <path d="M175,222 C171,210 168,200 171,192" stroke="#ff6f00" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M225,222 C229,210 232,200 229,192" stroke="#ffa000" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- INFO TAG / LABEL at bottom -->
  <rect x="120" y="340" width="160" height="42" rx="8" fill="white" opacity="0.95"/>
  <rect x="120" y="340" width="160" height="10" rx="8" fill="url(#gold-fi)"/>
  <rect x="120" y="346" width="160" height="4" fill="url(#gold-fi)"/>
  <text x="200" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">PREMIUM</text>
  <text x="200" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#1b5e20" text-anchor="middle" letter-spacing="1">FLEUR INDOOR CBD</text>
  <text x="200" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#555555" text-anchor="middle" letter-spacing="0.5">~20% CBD · Indica · BORÉA</text>
</svg>
