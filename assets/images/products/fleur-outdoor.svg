<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-fo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f8f0"/>
    </radialGradient>
    <!-- Warm earthy glow -->
    <radialGradient id="earth-glow-fo" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#558b2f" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#2e7d32" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0.02"/>
    </radialGradient>
    <!-- Bud core - greener for outdoor sativa-dominant -->
    <radialGradient id="bud-core-fo" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="40%" stop-color="#558b2f"/>
      <stop offset="75%" stop-color="#33691e"/>
      <stop offset="100%" stop-color="#1a4a0a"/>
    </radialGradient>
    <!-- Orange/golden tint (no purple - outdoor) -->
    <radialGradient id="amber-fo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="leaf-fo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="50%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <linearGradient id="stem-fo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="50%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <linearGradient id="gold-fo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <filter id="shadow-fo" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="18" result="offsetBlur"/>
      <feFlood flood-color="#1a3a10" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bud-glow-fo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#8bc34a" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-fo)"/>
  <ellipse cx="200" cy="190" rx="130" ry="120" fill="url(#earth-glow-fo)"/>
  <ellipse cx="200" cy="365" rx="90" ry="12" fill="#1a3a10" opacity="0.09"/>

  <g filter="url(#shadow-fo)">
    <!-- Stem (thicker, woodier outdoor) -->
    <rect x="194" y="290" width="12" height="70" rx="5" fill="url(#stem-fo)"/>
    <rect x="197" y="290" width="3" height="65" rx="1.5" fill="#8d6e63" opacity="0.5"/>

    <!-- WIDE FAN LEAVES (outdoor style - big spread) -->
    <!-- Far left leaf -->
    <g transform="translate(148, 255) rotate(-50)">
      <path d="M0,0 C-18,-25 -30,-55 -12,-75 C6,-55 12,-25 0,0Z" fill="url(#leaf-fo)" opacity="0.80"/>
      <path d="M0,0 C-6,-28 -10,-55 -12,-75" stroke="#33691e" stroke-width="0.8" fill="none" opacity="0.45"/>
    </g>
    <!-- Far right leaf -->
    <g transform="translate(252, 255) rotate(50)">
      <path d="M0,0 C18,-25 30,-55 12,-75 C-6,-55 -12,-25 0,0Z" fill="url(#leaf-fo)" opacity="0.80"/>
    </g>
    <!-- Mid-left leaf -->
    <g transform="translate(170, 250) rotate(-25)">
      <path d="M0,0 C-14,-20 -22,-45 -8,-60 C5,-45 8,-20 0,0Z" fill="url(#leaf-fo)" opacity="0.75"/>
    </g>
    <!-- Mid-right leaf -->
    <g transform="translate(230, 250) rotate(25)">
      <path d="M0,0 C14,-20 22,-45 8,-60 C-5,-45 -8,-20 0,0Z" fill="url(#leaf-fo)" opacity="0.75"/>
    </g>

    <!-- MAIN BUD - sativa style (more elongated, airy) -->
    <g filter="url(#bud-glow-fo)">
      <!-- Central elongated bud column -->
      <ellipse cx="200" cy="200" rx="55" ry="90" fill="url(#bud-core-fo)"/>
      <!-- Amber/orange subtle overlay -->
      <ellipse cx="202" cy="195" rx="30" ry="55" fill="url(#amber-fo)"/>

      <!-- Satellite buds - spread out (sativa) -->
      <ellipse cx="162" cy="235" rx="32" ry="42" fill="url(#bud-core-fo)" opacity="0.85"/>
      <ellipse cx="238" cy="235" rx="32" ry="42" fill="url(#bud-core-fo)" opacity="0.85"/>
      <ellipse cx="200" cy="155" rx="36" ry="52" fill="url(#bud-core-fo)" opacity="0.92"/>
      <!-- Smaller tip buds -->
      <ellipse cx="182" cy="175" rx="22" ry="32" fill="url(#bud-core-fo)" opacity="0.80"/>
      <ellipse cx="218" cy="175" rx="22" ry="32" fill="url(#bud-core-fo)" opacity="0.80"/>
    </g>

    <!-- Calyxes definition -->
    <ellipse cx="200" cy="180" rx="16" ry="20" fill="#558b2f" opacity="0.6"/>
    <ellipse cx="192" cy="192" rx="12" ry="16" fill="#7cb342" opacity="0.5"/>
    <ellipse cx="210" cy="190" rx="12" ry="16" fill="#7cb342" opacity="0.5"/>
    <ellipse cx="200" cy="210" rx="18" ry="23" fill="#558b2f" opacity="0.5"/>
    <ellipse cx="164" cy="238" rx="16" ry="20" fill="#558b2f" opacity="0.5"/>
    <ellipse cx="236" cy="238" rx="16" ry="20" fill="#558b2f" opacity="0.5"/>

    <!-- Trichomes (white) - sparser than indoor, more golden -->
    <circle cx="200" cy="170" r="2" fill="white" opacity="0.65"/>
    <circle cx="193" cy="160" r="1.8" fill="white" opacity="0.60"/>
    <circle cx="208" cy="162" r="1.8" fill="white" opacity="0.58"/>
    <circle cx="186" cy="178" r="1.8" fill="white" opacity="0.62"/>
    <circle cx="215" cy="175" r="1.8" fill="white" opacity="0.60"/>
    <circle cx="200" cy="198" r="2" fill="white" opacity="0.62"/>
    <circle cx="178" cy="215" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="224" cy="213" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="165" cy="230" r="1.5" fill="white" opacity="0.50"/>
    <circle cx="237" cy="232" r="1.5" fill="white" opacity="0.50"/>
    <!-- Amber trichomes (more present - outdoor ripe) -->
    <circle cx="205" cy="168" r="1.8" fill="#ff9800" opacity="0.65"/>
    <circle cx="196" cy="180" r="1.5" fill="#ff9800" opacity="0.60"/>
    <circle cx="212" cy="182" r="1.5" fill="#ffa000" opacity="0.60"/>
    <circle cx="200" cy="195" r="1.8" fill="#ff9800" opacity="0.62"/>
    <circle cx="185" cy="205" r="1.4" fill="#ffa000" opacity="0.55"/>
    <circle cx="217" cy="203" r="1.4" fill="#ff9800" opacity="0.55"/>
    <circle cx="170" cy="225" r="1.4" fill="#ffa000" opacity="0.52"/>
    <circle cx="232" cy="227" r="1.4" fill="#ff9800" opacity="0.52"/>

    <!-- Pistils (red/orange - more numerous on outdoor ripe bud) -->
    <path d="M198,165 C196,153 194,142 197,134" stroke="#e65100" stroke-width="1.3" fill="none" opacity="0.85"/>
    <path d="M203,163 C205,151 207,141 204,133" stroke="#ff6d00" stroke-width="1.3" fill="none" opacity="0.80"/>
    <path d="M190,172 C187,160 184,149 187,141" stroke="#e65100" stroke-width="1.1" fill="none" opacity="0.75"/>
    <path d="M212,170 C215,158 218,148 215,140" stroke="#ff9800" stroke-width="1.1" fill="none" opacity="0.75"/>
    <path d="M195,188 C192,176 189,165 192,157" stroke="#e65100" stroke-width="1" fill="none" opacity="0.70"/>
    <path d="M206,186 C209,174 212,164 209,156" stroke="#ff6d00" stroke-width="1" fill="none" opacity="0.70"/>
    <path d="M175,222 C172,210 169,199 172,190" stroke="#e65100" stroke-width="1" fill="none" opacity="0.65"/>
    <path d="M227,220 C230,208 233,198 230,190" stroke="#ff9800" stroke-width="1" fill="none" opacity="0.65"/>
    <path d="M183,200 C180,188 177,178 180,170" stroke="#ff6d00" stroke-width="1" fill="none" opacity="0.60"/>
    <path d="M218,198 C221,186 224,176 221,168" stroke="#ffa000" stroke-width="1" fill="none" opacity="0.60"/>
  </g>

  <!-- Label / Info badge -->
  <rect x="120" y="340" width="160" height="42" rx="8" fill="white" opacity="0.95"/>
  <rect x="120" y="340" width="160" height="10" rx="8" fill="#558b2f"/>
  <rect x="120" y="346" width="160" height="4" fill="#558b2f"/>
  <text x="200" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">OUTDOOR</text>
  <text x="200" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#33691e" text-anchor="middle" letter-spacing="1">FLEUR OUTDOOR CBD</text>
  <text x="200" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#555555" text-anchor="middle" letter-spacing="0.5">~15% CBD · Sativa · GREENPURE</text>
</svg>
