<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-h20" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5f0"/>
    </radialGradient>
    <!-- Slightly taller/larger bottle for 20% (30ml) -->
    <linearGradient id="glass-h20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ab88a" stop-opacity="0.55"/>
      <stop offset="12%" stop-color="#c8e8c8" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#edfaed" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#f8fff8" stop-opacity="0.97"/>
      <stop offset="75%" stop-color="#c5e0c5" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#6a9a6a" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Deeper amber oil for 20% -->
    <linearGradient id="oil-h20" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#b08028" stop-opacity="0.68"/>
      <stop offset="50%" stop-color="#906010" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#584008" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="neck-h20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90b890" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#daf0da" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#80a880" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cap-h20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="25%" stop-color="#c9a227"/>
      <stop offset="60%" stop-color="#e8c040"/>
      <stop offset="100%" stop-color="#8a6210"/>
    </linearGradient>
    <radialGradient id="cap-top-h20" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#8a6210"/>
    </radialGradient>
    <linearGradient id="label-h20" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3faf3"/>
    </linearGradient>
    <linearGradient id="label-green-h20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="gold-h20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="30%" stop-color="#c9a227"/>
      <stop offset="65%" stop-color="#f0d055"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <filter id="shadow-h20" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="4" dy="16" result="offsetBlur"/>
      <feFlood flood-color="#1a4020" flood-opacity="0.22" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="label-shadow-h20">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="bottle-clip-h20">
      <rect x="148" y="108" width="104" height="245" rx="16"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg-h20)"/>
  <ellipse cx="200" cy="200" rx="140" ry="150" fill="#2e7d32" opacity="0.025"/>
  <ellipse cx="201" cy="364" rx="64" ry="10" fill="#1a3a1a" opacity="0.14"/>

  <g filter="url(#shadow-h20)">
    <!-- Slightly wider bottle for 30ml -->
    <rect x="148" y="108" width="104" height="245" rx="16" fill="url(#oil-h20)" clip-path="url(#bottle-clip-h20)"/>
    <rect x="148" y="108" width="104" height="245" rx="16" fill="url(#glass-h20)" stroke="#a8c8a8" stroke-width="0.8"/>
    <rect x="168" y="68" width="64" height="44" rx="9" fill="url(#neck-h20)" stroke="#a0c0a0" stroke-width="0.7"/>
    <rect x="174" y="73" width="10" height="34" rx="5" fill="white" opacity="0.38"/>
    <rect x="166" y="106" width="68" height="7" rx="3.5" fill="url(#gold-h20)"/>
    <rect x="166" y="106" width="68" height="2" rx="1" fill="white" opacity="0.3"/>
    <rect x="168" y="66" width="64" height="5" rx="2.5" fill="url(#gold-h20)"/>
    <rect x="156" y="118" width="15" height="225" rx="7" fill="white" opacity="0.52"/>
    <rect x="174" y="116" width="6" height="110" rx="3" fill="white" opacity="0.24"/>
    <ellipse cx="200" cy="115" rx="44" ry="8" fill="white" opacity="0.30"/>
    <rect x="229" y="128" width="7" height="170" rx="3.5" fill="white" opacity="0.14"/>
    <ellipse cx="200" cy="349" rx="46" ry="6" fill="white" opacity="0.22"/>

    <rect x="156" y="162" width="88" height="145" rx="6" fill="url(#label-h20)" filter="url(#label-shadow-h20)" stroke="#d8ead8" stroke-width="0.8"/>
    <rect x="156" y="162" width="88" height="25" rx="6" fill="url(#label-green-h20)"/>
    <rect x="156" y="175" width="88" height="12" fill="url(#label-green-h20)"/>
    <text x="200" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">BORÉA</text>
    <text x="200" y="183" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1.5">CBD PREMIUM</text>

    <g transform="translate(200, 203)">
      <path d="M0,-11.5 C8,-5.5 8,5.5 0,11.5 C-8,5.5 -8,-5.5 0,-11.5Z" fill="#2e7d32" opacity="0.80"/>
      <line x1="0" y1="-9" x2="0" y2="9.5" stroke="#c9a227" stroke-width="0.9"/>
      <line x1="-5.5" y1="1" x2="5.5" y2="1" stroke="#c9a227" stroke-width="0.6" opacity="0.7"/>
    </g>

    <text x="200" y="223" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#222222" text-anchor="middle" letter-spacing="1.8">HUILE CBD</text>
    <!-- 20% – bigger font, premium styling -->
    <text x="200" y="255" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="#1b5e20" text-anchor="middle" letter-spacing="-1">20%</text>
    <rect x="166" y="262" width="68" height="2.5" rx="1.25" fill="url(#gold-h20)"/>
    <text x="200" y="276" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#444444" text-anchor="middle" letter-spacing="0.5">30 ml · 6000 mg CBD</text>
    <text x="200" y="289" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#777777" text-anchor="middle" letter-spacing="0.3">Full Spectrum · Chanvre BIO</text>
    <!-- "Force" badge -->
    <rect x="172" y="296" width="56" height="12" rx="6" fill="#2e7d32"/>
    <text x="200" y="305" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">HAUTE CONCENTRATION</text>

    <rect x="178" y="37" width="44" height="34" rx="7" fill="url(#cap-h20)"/>
    <ellipse cx="200" cy="37" rx="22" ry="7.5" fill="url(#cap-top-h20)"/>
    <rect x="182" y="41" width="11" height="22" rx="4.5" fill="white" opacity="0.24"/>
    <rect x="195" y="20" width="10" height="20" rx="4" fill="url(#cap-h20)"/>
    <ellipse cx="200" cy="20" rx="5" ry="3.5" fill="#8a6210"/>
    <ellipse cx="200" cy="13" rx="3.8" ry="4.5" fill="#c9a227" opacity="0.75"/>
    <ellipse cx="198.5" cy="11.5" rx="1.2" ry="1.5" fill="white" opacity="0.5"/>
  </g>

  <g opacity="0.045" transform="translate(330, 58) rotate(30) scale(2.2)">
    <path d="M0,-16 C11,-8 11,8 0,16 C-11,8 -11,-8 0,-16Z" fill="#2e7d32"/>
  </g>
</svg>
