<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Night-blue background for sleep -->
    <radialGradient id="bg-hs" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f8"/>
    </radialGradient>
    <!-- Dark violet-blue glass bottle -->
    <linearGradient id="glass-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a6aa8" stop-opacity="0.55"/>
      <stop offset="12%" stop-color="#a8a8d8" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#d8d8f5" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#f0f0ff" stop-opacity="0.97"/>
      <stop offset="75%" stop-color="#a0a0d0" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#606098" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Lavender-tinted oil -->
    <linearGradient id="oil-hs" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#9090c8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c9a227" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#6060a0" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="neck-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8080b8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#d0d0f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7070a8" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Navy/midnight cap -->
    <linearGradient id="cap-hs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a7a"/>
      <stop offset="30%" stop-color="#1a1a5e"/>
      <stop offset="65%" stop-color="#28286e"/>
      <stop offset="100%" stop-color="#0e0e3a"/>
    </linearGradient>
    <radialGradient id="cap-top-hs" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a4a8a"/>
      <stop offset="100%" stop-color="#0a0a30"/>
    </radialGradient>
    <linearGradient id="label-hs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5ff"/>
    </linearGradient>
    <!-- Deep navy/indigo label header -->
    <linearGradient id="label-navy-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1b4a"/>
      <stop offset="50%" stop-color="#1a2870"/>
      <stop offset="100%" stop-color="#0d1b4a"/>
    </linearGradient>
    <linearGradient id="gold-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="30%" stop-color="#c9a227"/>
      <stop offset="65%" stop-color="#f0d055"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <filter id="shadow-hs" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="4" dy="16" result="offsetBlur"/>
      <feFlood flood-color="#0d1b4a" flood-opacity="0.22" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="label-shadow-hs">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="bottle-clip-hs">
      <rect x="150" y="115" width="100" height="235" rx="15"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg-hs)"/>
  <!-- Night ambiance glow -->
  <ellipse cx="200" cy="200" rx="140" ry="150" fill="#1a2870" opacity="0.03"/>
  <!-- Stars (tiny dots) -->
  <circle cx="320" cy="70" r="1.5" fill="#c9a227" opacity="0.6"/>
  <circle cx="340" cy="50" r="1" fill="#c9a227" opacity="0.5"/>
  <circle cx="305" cy="45" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="75" cy="85" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="60" cy="110" r="1" fill="#c9a227" opacity="0.4"/>
  <circle cx="95" cy="60" r="1.2" fill="white" opacity="0.35"/>
  <ellipse cx="201" cy="362" rx="62" ry="10" fill="#0d1b4a" opacity="0.14"/>

  <g filter="url(#shadow-hs)">
    <rect x="150" y="115" width="100" height="235" rx="15" fill="url(#oil-hs)" clip-path="url(#bottle-clip-hs)"/>
    <rect x="150" y="115" width="100" height="235" rx="15" fill="url(#glass-hs)" stroke="#9898c8" stroke-width="0.8"/>
    <rect x="170" y="75" width="60" height="44" rx="9" fill="url(#neck-hs)" stroke="#9090b8" stroke-width="0.7"/>
    <rect x="176" y="80" width="10" height="34" rx="5" fill="white" opacity="0.38"/>
    <rect x="168" y="113" width="64" height="7" rx="3.5" fill="url(#gold-hs)"/>
    <rect x="168" y="113" width="64" height="2" rx="1" fill="white" opacity="0.3"/>
    <rect x="170" y="73" width="60" height="5" rx="2.5" fill="url(#gold-hs)"/>
    <rect x="158" y="125" width="14" height="215" rx="7" fill="white" opacity="0.48"/>
    <rect x="175" y="123" width="6" height="100" rx="3" fill="white" opacity="0.22"/>
    <ellipse cx="200" cy="122" rx="42" ry="8" fill="white" opacity="0.28"/>
    <rect x="228" y="135" width="7" height="160" rx="3.5" fill="white" opacity="0.12"/>
    <ellipse cx="200" cy="345" rx="44" ry="6" fill="white" opacity="0.20"/>

    <rect x="158" y="168" width="84" height="140" rx="6" fill="url(#label-hs)" filter="url(#label-shadow-hs)" stroke="#d0d0e8" stroke-width="0.8"/>
    <rect x="158" y="168" width="84" height="24" rx="6" fill="url(#label-navy-hs)"/>
    <rect x="158" y="180" width="84" height="12" fill="url(#label-navy-hs)"/>
    <text x="200" y="177" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">BORÉA</text>
    <text x="200" y="188" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#b0b8e0" text-anchor="middle" letter-spacing="1.5">CBD NUIT</text>

    <!-- Moon icon -->
    <g transform="translate(200, 210)">
      <path d="M-10,0 A10,10 0 0,1 10,0 A6,6 0 0,0 -10,0Z" fill="#1a2870" opacity="0.8"/>
      <circle cx="2" cy="-2" r="8" fill="none" stroke="#1a2870" stroke-width="2"/>
      <path d="M-7,-4 A8,8 0 1,0 7,6 A5,5 0 1,1 -7,-4Z" fill="#1a2870" opacity="0.85"/>
    </g>

    <!-- Stars inside label -->
    <circle cx="175" cy="208" r="1.5" fill="#c9a227" opacity="0.7"/>
    <circle cx="225" cy="208" r="1.5" fill="#c9a227" opacity="0.7"/>
    <circle cx="178" cy="215" r="1" fill="#c9a227" opacity="0.5"/>
    <circle cx="222" cy="215" r="1" fill="#c9a227" opacity="0.5"/>

    <text x="200" y="228" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1a4a" text-anchor="middle" letter-spacing="1.5">HUILE SOMMEIL</text>
    <text x="200" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#1a2870" text-anchor="middle" letter-spacing="-0.5">15%</text>
    <text x="200" y="257" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#5555a0" text-anchor="middle" letter-spacing="0.5">CBD + Mélatonine + Lavande</text>
    <rect x="168" y="263" width="64" height="2" rx="1" fill="url(#gold-hs)"/>
    <text x="200" y="276" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#444444" text-anchor="middle" letter-spacing="0.5">10 ml · 1500 mg CBD</text>
    <text x="200" y="289" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#777777" text-anchor="middle" letter-spacing="0.3">Formule Relaxation Nocturne</text>
    <rect x="158" y="299" width="84" height="9" rx="4" fill="#1a2870" opacity="0.12"/>

    <!-- Night cap -->
    <rect x="178" y="44" width="44" height="34" rx="7" fill="url(#cap-hs)"/>
    <ellipse cx="200" cy="44" rx="22" ry="7.5" fill="url(#cap-top-hs)"/>
    <rect x="182" y="48" width="10" height="22" rx="4.5" fill="white" opacity="0.18"/>
    <rect x="195" y="27" width="10" height="20" rx="4" fill="url(#cap-hs)"/>
    <ellipse cx="200" cy="27" rx="5" ry="3.5" fill="#0a0a30"/>
    <ellipse cx="200" cy="20" rx="3.8" ry="4.5" fill="#9090c0" opacity="0.75"/>
    <ellipse cx="198.5" cy="18.5" rx="1.2" ry="1.5" fill="white" opacity="0.4"/>
  </g>
</svg>
