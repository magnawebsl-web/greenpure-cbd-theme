<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-psom" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f0f8"/>
    </radialGradient>
    <!-- Night blue bottle glass -->
    <linearGradient id="glass-psom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6060a0" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#a8a8d8" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#d8d8f5" stop-opacity="0.92"/>
      <stop offset="75%" stop-color="#9898c8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5050a0" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Night oil (lavender) -->
    <linearGradient id="oil-psom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8080b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#404080" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Night cap (midnight) -->
    <linearGradient id="cap-psom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a7a"/>
      <stop offset="50%" stop-color="#1a1a5e"/>
      <stop offset="100%" stop-color="#0a0a38"/>
    </linearGradient>
    <!-- Purple gummies jar glass -->
    <linearGradient id="jar-psom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b0c8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f0f0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9898b8" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Purple gummies colors -->
    <radialGradient id="g-purple-psom" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
    <radialGradient id="g-blue-psom" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </radialGradient>
    <!-- Night lid (midnight) -->
    <linearGradient id="lid-psom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a7a"/>
      <stop offset="50%" stop-color="#1a1a5e"/>
      <stop offset="100%" stop-color="#0a0a38"/>
    </linearGradient>
    <radialGradient id="lid-top-psom" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#5a5a9a"/>
      <stop offset="100%" stop-color="#06063a"/>
    </radialGradient>
    <!-- Infusion bag kraft -->
    <linearGradient id="kraft-psom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a070"/>
      <stop offset="50%" stop-color="#b07848"/>
      <stop offset="100%" stop-color="#9a6030"/>
    </linearGradient>
    <!-- Gold accent -->
    <linearGradient id="gold-psom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <!-- Box night navy -->
    <linearGradient id="box-psom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b4a"/>
      <stop offset="50%" stop-color="#1a2870"/>
      <stop offset="100%" stop-color="#0d1b4a"/>
    </linearGradient>
    <filter id="shadow-psom" x="-20%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="3" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#0d1b4a" flood-opacity="0.20" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="jar-clip-psom">
      <rect x="258" y="198" width="72" height="125" rx="10"/>
    </clipPath>
    <clipPath id="b1-clip-psom">
      <rect x="90" y="108" width="65" height="190" rx="10"/>
    </clipPath>
