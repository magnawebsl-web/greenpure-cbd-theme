      <circle cx="223" cy="190" r="1.2" fill="#c9a227" opacity="0.70"/>
      <circle cx="192" cy="197" r="0.9" fill="#c9a227" opacity="0.55"/>
      <circle cx="226" cy="197" r="0.9" fill="#c9a227" opacity="0.55"/>
      <text x="209" y="209" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1a2870" text-anchor="middle">INFUSION</text>
      <text x="209" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="700" fill="#0d1b4a" text-anchor="middle">SOMMEIL</text>
      <text x="209" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="900" fill="#4a148c" text-anchor="middle">100mg</text>
      <text x="209" y="242" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" fill="#777777" text-anchor="middle">CBD · 20 sachets</text>
      <rect x="181" y="246" width="56" height="1.5" rx="0.75" fill="url(#gold-psom)"/>
      <text x="209" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" fill="#555555" text-anchor="middle">Camomille · Tilleul</text>
      <text x="209" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#777777" text-anchor="middle">Lavande · Valériane</text>
