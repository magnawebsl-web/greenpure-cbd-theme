      <rect x="168" y="138" width="72" height="7" fill="#9a6030" opacity="0.45"/>
      <!-- Hang holes -->
      <circle cx="180" cy="116" r="4" fill="#c4a070" stroke="#9a5820" stroke-width="0.8"/>
      <circle cx="180" cy="116" r="2" fill="#8a5018"/>
      <circle cx="228" cy="116" r="4" fill="#c4a070" stroke="#9a5820" stroke-width="0.8"/>
      <circle cx="228" cy="116" r="2" fill="#8a5018"/>

