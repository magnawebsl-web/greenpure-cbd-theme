      <circle cx="310" cy="241" r="1.2" fill="#c9a227" opacity="0.70"/>
      <text x="294" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="700" fill="#1a2870" text-anchor="middle">SOMMEIL</text>
      <text x="294" y="267" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#4a148c" text-anchor="middle">25mg</text>
      <rect x="273" y="271" width="42" height="1" rx="0.5" fill="url(#gold-psom)"/>
      <text x="294" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4.5" fill="#555555" text-anchor="middle">30 pc · +Mélatonine</text>
