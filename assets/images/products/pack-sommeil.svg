  <circle cx="82" cy="342" r="1" fill="#c9a227" opacity="0.50"/>
  <circle cx="320" cy="332" r="1.5" fill="#c9a227" opacity="0.60"/>
  <circle cx="335" cy="344" r="1" fill="#c9a227" opacity="0.50"/>
