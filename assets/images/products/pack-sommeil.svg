  <circle cx="80" cy="38" r="1" fill="white" opacity="0.45"/>
  <circle cx="335" cy="62" r="1.5" fill="#c9a227" opacity="0.55"/>
  <circle cx="355" cy="45" r="1" fill="white" opacity="0.40"/>
  <circle cx="318" cy="78" r="1.2" fill="#c9a227" opacity="0.45"/>
  <ellipse cx="205" cy="365" rx="148" ry="13" fill="#0d1b4a" opacity="0.11"/>

  <!-- PACK BOX (navy) -->
