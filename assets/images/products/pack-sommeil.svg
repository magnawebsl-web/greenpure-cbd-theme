      <circle cx="134" cy="174" r="1.2" fill="#c9a227" opacity="0.70"/>
      <text x="122" y="188" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="700" fill="#1a2870" text-anchor="middle">SOMMEIL</text>
      <text x="122" y="202" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#1a2870" text-anchor="middle">15%</text>
      <rect x="103" y="208" width="38" height="1.5" rx="0.75" fill="url(#gold-psom)"/>
      <text x="122" y="217" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#666666" text-anchor="middle">10ml · 1500mg</text>
