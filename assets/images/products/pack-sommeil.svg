  <rect x="45" y="278" width="310" height="6" rx="5" fill="white" opacity="0.15"/>
  <text x="200" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" fill="#0d1b4a" text-anchor="middle" letter-spacing="1">PACK NUIT · 3 PRODUITS · ÉCONOMISEZ 30%</text>
