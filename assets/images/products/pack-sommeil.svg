      <!-- Bag shine -->
      <rect x="168" y="142" width="18" height="156" fill="#c4a070" opacity="0.20"/>
      <!-- Texture lines -->
      <line x1="170" y1="155" x2="238" y2="155" stroke="#9a6030" stroke-width="0.7" opacity="0.20"/>
      <line x1="170" y1="175" x2="238" y2="175" stroke="#9a6030" stroke-width="0.7" opacity="0.18"/>
      <line x1="170" y1="195" x2="238" y2="195" stroke="#9a6030" stroke-width="0.7" opacity="0.16"/>
      <line x1="170" y1="215" x2="238" y2="215" stroke="#9a6030" stroke-width="0.7" opacity="0.14"/>
      <line x1="170" y1="235" x2="238" y2="235" stroke="#9a6030" stroke-width="0.7" opacity="0.12"/>
      <line x1="170" y1="255" x2="238" y2="255" stroke="#9a6030" stroke-width="0.7" opacity="0.10"/>
      <line x1="170" y1="275" x2="238" y2="275" stroke="#9a6030" stroke-width="0.7" opacity="0.10"/>
