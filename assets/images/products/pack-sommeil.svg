      <ellipse cx="294" cy="180" rx="36" ry="9" fill="url(#lid-top-psom)"/>
      <ellipse cx="280" cy="177" rx="15" ry="5" fill="white" opacity="0.12"/>
      <!-- Gold star on lid -->
      <polygon points="294,169 296,175 302,175 297.5,179 299,185 294,181.5 289,185 290.5,179 286,175 292,175" fill="#c9a227" opacity="0.55"/>
