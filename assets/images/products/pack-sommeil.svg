  <rect x="45" y="300" width="310" height="15" rx="8" fill="#060e2a"/>
  <rect x="48" y="302" width="304" height="8" rx="4" fill="white" opacity="0.06"/>
  <rect x="45" y="315" width="310" height="6" rx="0" fill="url(#gold-psom)" opacity="0.70"/>
  <rect x="45" y="353" width="310" height="7" rx="4" fill="#040c1e"/>
  <!-- Stars on box -->
