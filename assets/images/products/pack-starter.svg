  <text x="200" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" fill="#1b5e20" text-anchor="middle" letter-spacing="1">PACK STARTER · 3 PRODUITS · ÉCONOMISEZ 25%</text>
</svg>
