      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#c9a227" stroke-width="0.7"/>
    </g>
    <text x="300" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="700" fill="#222222" text-anchor="middle">GUMMIES</text>
    <text x="300" y="263" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#e65100" text-anchor="middle" font-weight="700">25mg CBD</text>
    <rect x="279" y="267" width="42" height="1" rx="0.5" fill="url(#gold-ps)"/>
    <text x="300" y="276" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4.5" fill="#666666" text-anchor="middle">30 pièces · Fruits</text>
    <text x="300" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4" fill="#888888" text-anchor="middle">Vegan · Sans sucre</text>
    <!-- Jar lid -->
