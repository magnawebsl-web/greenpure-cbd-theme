      <ellipse cx="300" cy="305" rx="10" ry="8" fill="url(#g-green-ps)" opacity="0.88"/>
      <ellipse cx="316" cy="300" rx="9" ry="8" fill="url(#g-orange-ps)" opacity="0.88"/>
      <ellipse cx="288" cy="285" rx="10" ry="8" fill="url(#g-green-ps)" opacity="0.85"/>
      <ellipse cx="305" cy="288" rx="9" ry="8" fill="url(#g-red-ps)" opacity="0.85"/>
      <ellipse cx="319" cy="282" rx="9" ry="7" fill="url(#g-orange-ps)" opacity="0.82"/>
      <ellipse cx="284" cy="270" rx="9" ry="7" fill="url(#g-orange-ps)" opacity="0.80"/>
      <ellipse cx="302" cy="272" rx="10" ry="8" fill="url(#g-green-ps)" opacity="0.78"/>
      <!-- Shine on visible gummies -->
