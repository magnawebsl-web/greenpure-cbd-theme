    <rect x="272" y="215" width="56" height="14" rx="4" fill="#2e7d32"/>
    <rect x="272" y="222" width="56" height="7" fill="#2e7d32"/>
    <text x="300" y="221" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">GREENPURE</text>
    <text x="300" y="228" font-family="'Helvetica Neue', Arial, sans-serif" font-size="3.5" fill="#c8e8c8" text-anchor="middle">GUMMIES</text>
    <g transform="translate(300, 240)">
