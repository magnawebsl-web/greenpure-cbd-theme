      <rect x="106" y="156" width="50" height="7" fill="#2e7d32"/>
      <text x="131" y="155" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4.5" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">GREENPURE</text>
      <text x="131" y="162" font-family="'Helvetica Neue', Arial, sans-serif" font-size="3.5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1">CBD</text>
      <text x="131" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="600" fill="#333333" text-anchor="middle">HUILE CBD</text>
      <text x="131" y="192" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#2e7d32" text-anchor="middle">5%</text>
      <rect x="113" y="198" width="36" height="1.5" rx="0.75" fill="url(#gold-ps)"/>
