      <rect x="204" y="68" width="8" height="22" rx="3" fill="url(#cap-ps)"/>
      <ellipse cx="208" cy="68" rx="4" ry="3" fill="#8a6210"/>
      <ellipse cx="208" cy="62" rx="3" ry="3.5" fill="#c9a227" opacity="0.75"/>
