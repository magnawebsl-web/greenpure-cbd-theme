    <rect x="265" y="198" width="68" height="125" rx="10" fill="url(#jar-ps)" stroke="#c0c0c0" stroke-width="0.7"/>
    <rect x="271" y="207" width="9" height="108" rx="4.5" fill="white" opacity="0.40"/>
    <ellipse cx="299" cy="205" rx="30" ry="7" fill="white" opacity="0.22"/>
    <!-- Jar threads -->
    <rect x="267" y="195" width="64" height="7" rx="3.5" fill="#b8b8b8" opacity="0.6"/>
    <!-- Jar label mini -->
