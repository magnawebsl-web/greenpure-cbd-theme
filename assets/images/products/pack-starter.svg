<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-ps" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5f0"/>
    </radialGradient>
    <!-- Bottle 1 (5% - light green glass) -->
    <linearGradient id="glass1-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ab88a" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#edfaed" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#c5e0c5" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#6a9a6a" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Bottle 2 (10% - slightly darker) -->
    <linearGradient id="glass2-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a9a6a" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#d5f0d5" stop-opacity="0.90"/>
      <stop offset="65%" stop-color="#a8c8a8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5a8a5a" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Gummies jar glass -->
    <linearGradient id="jar-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0d0" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#f8f8f8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a8a8a8" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Oil fill -->
    <linearGradient id="oil-ps" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a5e10" stop-opacity="0.72"/>
    </linearGradient>
    <!-- Golden cap -->
    <linearGradient id="cap-ps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6210"/>
    </linearGradient>
    <!-- Jar lid gold -->
    <linearGradient id="lid-ps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6210"/>
    </linearGradient>
    <radialGradient id="lid-top-ps" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f5dc70"/>
      <stop offset="100%" stop-color="#6a4808"/>
    </radialGradient>
    <!-- Gold accent -->
    <linearGradient id="gold-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <!-- Pack box -->
    <linearGradient id="box-ps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- Banner -->
    <linearGradient id="banner-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6810"/>
      <stop offset="30%" stop-color="#c9a227"/>
      <stop offset="60%" stop-color="#f0d055"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
    <!-- Gummy colors -->
    <radialGradient id="g-red-ps" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <radialGradient id="g-green-ps" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <radialGradient id="g-orange-ps" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffab40"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <filter id="shadow-ps" x="-20%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="3" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#1a3a10" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="jar-clip-ps">
