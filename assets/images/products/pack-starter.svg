      <text x="208" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="3.5" fill="#c8e8c8" text-anchor="middle" letter-spacing="1">CBD</text>
      <text x="208" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="600" fill="#333333" text-anchor="middle">HUILE CBD</text>
      <text x="208" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#1b5e20" text-anchor="middle">10%</text>
      <rect x="190" y="206" width="36" height="1.5" rx="0.75" fill="url(#gold-ps)"/>
      <text x="208" y="215" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#666666" text-anchor="middle">10ml · 1000mg</text>
